<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Assessment — Tartar School</title>
<link rel="icon" href="../assets/favicon.png">
<link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>
<div id="shell" class="shell">
  <div class="shell-content">
    <main id="main" class="main">

      <div class="page-header">
        <div>
          <div class="eyebrow">Assessment</div>
          <h1>Marks &amp; reports</h1>
          <p class="desc" id="pageDesc">Term 3 CAT 1 is open. Grade 9 sits KJSEA soon — keep their School-Based Assessment portfolio current.</p>
        </div>
      </div>

      <div class="tabs-wrap">
        <div class="tabs-list">
          <button type="button" class="tab-btn active" data-tab="entry">Marks entry</button>
          <button type="button" class="tab-btn" data-tab="reports">Reports</button>
        </div>

        <!-- ===================== MARKS ENTRY ===================== -->
        <div class="tab-panel" data-panel="entry">
          <div class="controls-row">
            <div class="select-wrap"><select id="eAssessment"></select></div>
            <div class="select-wrap"><select id="eGrade"></select></div>
            <div class="select-wrap"><select id="eGroup"></select></div>
            <div class="select-wrap"><select id="eSubject"></select></div>
          </div>
          <div class="list-plain" id="entryBody"></div>
          <p class="small muted mt-3" id="entryNote"></p>
        </div>

        <!-- ===================== REPORTS ===================== -->
        <div class="tab-panel" data-panel="reports" hidden>
          <div class="controls-row" style="margin-bottom:10px;">
            <div class="tabs-list" id="reportTypeTabs">
              <button type="button" class="tab-btn active" data-rtype="learner">Learner</button>
              <button type="button" class="tab-btn" data-rtype="class">Class</button>
              <button type="button" class="tab-btn" data-rtype="subject">Subject</button>
              <button type="button" class="tab-btn" data-rtype="overview">Overview</button>
            </div>
          </div>
          <div class="controls-row" id="reportControls"></div>

          <div class="card" style="margin-bottom:14px;">
            <div class="card-pad row-between" style="flex-wrap:wrap;gap:10px;">
              <div>
                <div class="card-title" id="reportTitle">Report</div>
                <div class="small muted" id="reportSubtitle">Choose the filters above</div>
              </div>
              <div class="actions no-print" style="display:flex;gap:8px;flex-wrap:wrap;">
                <button type="button" class="btn btn-outline btn-sm" id="btnPrint"></button>
                <button type="button" class="btn btn-outline btn-sm" id="btnShare"></button>
                <button type="button" class="btn btn-primary btn-sm" id="btnDownload"></button>
              </div>
            </div>
          </div>

          <div class="report-shell">
            <div id="reportPreview" class="print-area">
              <p class="empty-note">Choose filters above to generate a report.</p>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<div id="toast-root" class="toast-root"></div>
<div id="overlay-root"></div>

<script src="../assets/js/data.js"></script>
<script src="../assets/js/pdfkit-mini.js"></script>
<script src="../assets/js/reports.js"></script>
<script src="../assets/js/shell.js"></script>
<script>Shell.init('assessment');</script>
<script src="../assets/js/assessment.js"></script>
</body>
</html>
